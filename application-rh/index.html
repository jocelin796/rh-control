<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RH Alertes & Congés</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">RH</div>
          <div>
            <h1>RH Control</h1>
            <p>Contrats · Congés · Alertes</p>
          </div>
        </div>

        <nav class="nav" aria-label="Navigation principale">
          <span class="nav-section">Pilotage</span>
          <button class="nav-link active" data-view="dashboard"><span>📊</span> Tableau de bord</button>
          <button class="nav-link" data-view="alerts"><span>🔔</span> Alertes RH</button>
          <span class="nav-section">Gestion RH</span>
          <button class="nav-link" data-view="employees"><span>👥</span> Collaborateurs</button>
          <button class="nav-link" data-view="personnel"><span>🧩</span> Personnel</button>
          <button class="nav-link" data-view="contracts"><span>📄</span> Contrats</button>
          <button class="nav-link" data-view="leaves"><span>🌴</span> Congés</button>
          <button class="nav-link" data-view="documents"><span>🗂️</span> Documents</button>
          <button class="nav-link" data-view="calendar"><span>🗓️</span> Calendrier</button>
          <button class="nav-link" data-view="returns"><span>↩️</span> Reprises</button>
          <span class="nav-section">Administration</span>
          <button class="nav-link" data-view="settings"><span>⚙️</span> Paramétrage</button>
          <button class="nav-link" data-view="history"><span>🧾</span> Historique</button>
        </nav>

        <div class="sidebar-card">
          <span class="label">Rôle actif</span>
          <select id="roleSelect">
            <option value="Collaborateur">Collaborateur</option>
            <option value="Assistant RH">Assistant RH</option>
            <option value="Direction">Direction</option>
            <option value="Admin RH">Admin RH</option>
          </select>
          <p id="roleHelp">Choisis le rôle avant de valider les congés ou traiter les documents.</p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Module fonctionnel RH</p>
            <h2 id="pageTitle">Tableau de bord</h2>
          </div>
          <div class="topbar-actions">
            <input id="globalSearch" type="search" placeholder="Rechercher un nom, matricule, service..." />
            <button class="secondary" data-action="logout" id="topLogout">Se déconnecter</button>
            <button class="danger-soft" id="resetDemo">Réinitialiser</button>
          </div>
        </header>

        <section id="appContent" class="content" aria-live="polite"></section>
      </main>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
